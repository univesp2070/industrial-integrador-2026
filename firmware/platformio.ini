; PlatformIO Project Configuration File
; Edge AI Industrial - Firmware

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    Wire
    SPI
build_flags =
    -DESP32
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION='"1.0.0"'

[env:esp32_sim]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
build_flags =
    -DESP32
    -DSIMULATION_MODE
    -DFIRMWARE_VERSION='"sim-1.0.0"'

[env:stm32]
platform = ststm32
board = nucleo_f446re
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
build_flags =
    -DSTM32

[env:native]
platform = native
build_flags =
    -DSIMULATION_MODE
    -DNATIVE_TEST
    -DFIRMWARE_VERSION='"test"'
lib_deps =
    bblanchon/ArduinoJson@^7.0
    throwtheswitch/Unity@^2.5.2
